name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接装 cmdline-tools，不依赖第三方 SDK action
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${RUNNER_TEMP:-/home/runner}/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 只写 sdk.dir，不注入任何 API Key。
      # -PprefillKeys=false 让 debug 构建的 BuildConfig 全部是占位符，
      # 安装包内不含任何真实密钥，使用者首次启动后自行填写。
      - name: Generate local.properties (sdk.dir only, no keys)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      # 发布密钥：仓库维护者在 GitHub Secrets 里配置了 RELEASE_KEYSTORE_B64 等
      # 4 个变量时，这里还原出 keystore.properties，release 构建即正式签名，
      # 老用户可以直接覆盖升级（不用卸载重装、不丢数据）。
      #
      # fork / PR / 未配置 Secrets 时自动降级为无签名 debug 构建，
      # CI 保持绿色，任何人都能 clone 构建。
      - name: Restore release keystore (if Secrets configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning::未配置签名 Secrets，本次构建为无签名 debug 包"
            echo "::warning::（配置方法见 README「维护者：正式签名发布」一节）"
            echo "SIGNING=off" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 还原后立刻自检：密钥损坏时要在构建前就发现，而不是产出一个装不上的包
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$STORE_PASSWORD" > /dev/null
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties 已生成（口令不回显）"
          echo "SIGNING=on" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${SIGNING:-off}" = "on" ]; then
            # release 构建类型本身不注入任何 Key（BuildConfig 是空串），无需 -PprefillKeys
            ./gradlew --no-daemon assembleRelease
            ls -lh app/build/outputs/apk/release/
          else
            ./gradlew --no-daemon assembleDebug -PprefillKeys=false
            ls -lh app/build/outputs/apk/debug/
          fi

      # 闸门：产物里绝不能出现 API Key（buildConfigField 的字符串会明文落在 DEX）
      - name: Verify no secrets in APK
        run: |
          set -euo pipefail
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          if [ "${SIGNING:-off}" = "on" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          unzip -qq "$APK" -d /tmp/apkcheck
          if grep -rEoh 'sk-[A-Za-z0-9]{20,}' /tmp/apkcheck/*.dex 2>/dev/null | head -n 5; then
            echo "::error::APK 中检测到疑似 API Key，拒绝上传"
            exit 1
          fi
          echo "APK 内未检测到 API Key"

      # 闸门（仅正式签名构建）：包必须真的签上名、且不能带 debuggable
      - name: Verify APK is signed (signed builds only)
        if: env.SIGNING == 'on'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # 必须带 --verbose：apksigner verify 不加它时，校验通过也不输出 "Verifies"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sig.txt
          grep -qE "Number of signers: [1-9]" /tmp/sig.txt || {
            echo "::error::APK 未报告签名者，拒绝上传"
            exit 1
          }
          # 发布包绝不能是 debuggable（任何用户数据都能被人附加调试读取）
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::发布包带上了 android:debuggable，拒绝上传"
            exit 1
          fi
          echo "签名校验通过"
          grep -E "certificate SHA-256" /tmp/sig.txt || true

      # 闸门（仅正式签名构建）：签名证书必须和仓库记录的指纹一致
      # fork 用户的密钥当然不一致，所以只在维护者的 main 上强制。
      - name: Verify signer matches recorded fingerprint (signed builds only)
        if: env.SIGNING == 'on'
        run: |
          set -euo pipefail
          EXPECTED=$(grep -vE '^[[:space:]]*#' signing/expected-cert-sha256.txt \
                     | grep -vE '^[[:space:]]*$' | head -1 \
                     | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          ACTUAL=$(grep -E "certificate SHA-256 digest" /tmp/sig.txt | head -1 \
                   | sed 's/.*:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ]; then
            echo "::warning::读不到期望或实际指纹，跳过一致性比对（期望长度 ${#EXPECTED}，实际长度 ${#ACTUAL}）"
            exit 0
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            if [ "${GITHUB_REPOSITORY}" = "ausyeah/mistake-recorder" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::签名证书与 signing/expected-cert-sha256.txt 不一致"
              echo "::error::已安装的用户将无法升级这个 App。请勿发布，先核对发布密钥。"
              echo "::error::  期望: $EXPECTED"
              echo "::error::  实际: $ACTUAL"
              exit 1
            fi
            echo "::warning::签名与仓库记录不一致（非维护者仓库，跳过）"
            echo "  期望: $EXPECTED"
            echo "  实际: $ACTUAL"
            exit 0
          fi
          echo "签名证书与仓库记录一致: $ACTUAL"

      - name: Prepare APK
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          SAFE_REF=$(echo "$REF" | tr '/' '-')
          mkdir -p dist
          # 命名规范：mistakebook-<version>-android.apk
          # 不再用 `-debug` 后缀——公开分发的就是唯一产物
          if [ "${SIGNING:-off}" = "on" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/mistakebook-${SAFE_REF}-android.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/mistakebook-${SAFE_REF}-android.apk"
          fi
          ls -lh dist/

      # 制品只随 tag 构建上传，且 7 天后自动过期。
      # 此前每次 push main 都上传 APK，8 天堆积 167 个 / 3.1 GB，撑爆配额。
      # 面向用户的分发走下面的 Release（永久保留，不计入 Actions 存储）。
      - name: Upload artifact (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mistakebook-apk
          path: dist/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装与首次配置

            1. 下载 `mistakebook-${{ github.ref_name }}-android.apk` 安装（需允许「安装未知来源应用」）
            2. 首次启动后进入 **设置**，填写两个密钥：
               - **MinerU API Key** —— 在 MinerU 开放平台申请
               - **大模型接入** —— 填接口地址与 API Key，点「获取模型列表」可自动选模型名

            > **本安装包不预置任何 API Key。** 密钥由使用者自行填写，只存本机加密存储。
            > 早期版本曾把密钥打进安装包，而 APK 里的密钥可以被直接提取。
            > 现已改为由使用者自行填写；如果你在旧版本里填过密钥，
            > 建议到服务商后台把它们重置一次。