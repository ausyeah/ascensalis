<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="katex.min.css"/>
<script src="katex.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /*
   * 绝对定位到页面原点：Android 侧按返回的宽高开一张位图，再 view.draw(canvas)
   * 把 WebView 左上角那一块抠出来。必须让 #out 贴住 (0,0)，否则量到的尺寸和位图对不上。
   */
  #out {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 32px;
    color: #1B1F26;
    white-space: nowrap;
    /*
     * 四边安全 padding：getBoundingClientRect() 返回的是排版盒，而斜体修正、
     * 分式横线、分式分子/分母、根号钩的实际墨水会略微溢出盒外，不留边就会被切。
     * 左右各 10：右边吸收斜体修正/右花括号，左边防无左侧间距的字符（如 \lim 的 l）贴缘。
     * 上下 14/16：分式分子上溢、分母下溢实测约 9~11 CSS px。
     * 这些 padding 没有排版代价：Android 侧拿到位图后会按不透明像素的包围盒
     * 把透明边裁掉（MathRenderer.trimTransparent），裁完紧贴墨水，Compose 侧无感。
     */
    padding: 14px 10px 16px 10px;
  }

  /*
   * 批量长卷：每行一个公式，行间留白是刻意加的——
   * 相邻两行的墨水溢出（分式下标、根号的钩）不能碰到下一行。
   * 切图时按 rect 取，行间白边不会混进位图。
   */
  #sheet {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    font-size: 32px;
    color: #1B1F26;
  }
  #sheet .cell {
    padding: 12px 0 14px 0;
    /* 不换行：行盒高度完全由本行公式决定，量到的 rect 就是它的实际墨水范围 */
    white-space: nowrap;
  }
  /*
   * 右边距放在 .body 上而不是 .cell 上：量到的 rect 是 holder 自己的包围盒，
   * cell 的 padding 不计入 holder rect，加在 cell 上等于没加。
   * 四边都要（与 #out 的 padding 同一目的）：吸收斜体修正、分隔符墨水的右缘溢出，
   * 以及分式分子/分母、根号钩、上下标的上下溢出。
   * 真机症状（v0.0.30 用户反馈）：\{x_n\} 的右花括号消失、x_n > 0 的 0 被竖向切成两半；
   * 同类竖向事故：\frac{e^x-1}{x} 分子顶/分母底被切（实测溢出上 8.66/下 10.55 CSS px）。
   */
  #sheet .body {
    display: inline-block;
    padding: 14px 10px 16px 10px;
  }
</style>
</head>
<body>
<div id="out"></div>
<div id="sheet"></div>
<script>
  var BASE_PX = 32;

  /**
   * KaTeX 在 throwOnError:false 时**不抛异常**，而是把无法解析的部分渲染成
   * **红色**的源码（外层 .katex-error，title 里是错误信息）。
   * 用户看到的「一坨红色的字」不是排版效果，是失败现场。
   *
   * 主动检出并回传失败标记，Android 侧就能回退成显示源码，而不是给用户看红色垃圾。
   */
  function hasRenderError(node) {
    if (!node) return false;
    if (node.classList && node.classList.contains('katex-error')) return true;
    for (var i = 0; i < node.childNodes.length; i++) {
      var child = node.childNodes[i];
      if (child.nodeType === 1 && hasRenderError(child)) return true;
    }
    return false;
  }

  /**
   * 渲染前先做一次「损坏自检」。
   *
   * KaTeX 不会因为 `x<TAB>o0` 报错——那是个完全合法的数学式，
   * 只是排出来是错的。所以光靠 .katex-error 检测**抓不到 JSON 转义吃掉的命令**，
   * 必须单独扫一遍控制字符。命中就说明公式已被破坏，直接判失败。
   */
  function looksCorrupted(latex) {
    // LaTeX 数学里不可能出现这些裸控制字符；出现即说明反斜杠被 JSON 转义吃掉了
    return /[\x00-\x08\x0B\x0C\x0E-\x1F]/.test(latex) || /\t[a-zA-Z]/.test(latex);
  }

  /**
   * 设置公式前景色。
   *
   * 深色模式（Dark Ink Paper）下 App 背景是 #19181D 级的近黑，
   * 而下面 CSS 里写死的 #1B1F26 是浅色模式的墨黑——
   * 抠出来的位图是**透明背景 + 深色字**，贴到深色界面上就是
   * 「一片深色叠一片深色」，用户看到的是空白。
   * Android 侧按当前主题调它，inline style 的优先级高于 id 选择器，
   * 所以这里设一次就能盖掉 CSS 默认值。
   */
  function setFgColor(css) {
    var out = document.getElementById('out');
    var sheet = document.getElementById('sheet');
    if (out) out.style.color = css;
    if (sheet) sheet.style.color = css;
  }

  /**
   * 等全部 KaTeX 字体就绪。**由页面加载阶段调用一次，之后 render 全程同步。**
   *
   * katex.min.css 的 @font-face 没写 font-display，浏览器按默认的
   * block 期处理：字体下载完成前，用**回退字体的度量**排版。
   * 于是「渲染完立刻量 getBoundingClientRect()」量到的是回退字体的宽度，
   * 而 Android 侧等几帧后 view.draw() 抓到的是真 KaTeX 字体（更宽）——
   * 按窄尺寸切图，公式最右端被整块切掉。
   *
   * 真机症状（v0.0.30 用户反馈）：`\{x_n\}` 的右花括号整个消失、
   * `x_n > 0` 的 `0` 被竖向切成左半边（看着像 `(`），
   * 而公式中间的字符完好——只有最右端被切，极具迷惑性。
   *
   * 本地 file:// 字体下载只要几毫秒，但 block 期的度量错误是**必然**的：
   * 只要测量发生在字体交换之前，量到的就是窄的。
   * 所以正确解法不是多等几帧，而是在测量前把字体加载这件事**显式做完**。
   *
   * ## 为什么这个等待不能放进 render() 里（v0.0.33 事故）
   *
   * render() 曾经是 async 函数、内部 await fontsReady()。
   * 但 Android 的 WebView.evaluateJavascript **不会 await Promise**：
   * 它把返回值 JSON.stringify 一下，Promise 序列化成 `{}`，
   * Kotlin 侧 parseSize 拿不到 w/h，整条链路断裂（v0.0.31~32 全量渲染失败）。
   * Playwright 的 page.evaluate 会自动 await，所以当时的"终验全过"是假象。
   *
   * 因此分工改为：**字体等待只在页面加载阶段做一次**（本函数 + 下面的
   * initFonts），完成后经 AndroidMath 桥通知 Kotlin；Kotlin 的 pageLoaded
   * 门等这个信号，门之后的 render()/renderBatch() 全部同步返回，
   * 与 evaluateJavascript 的语义精确匹配。
   *
   * FontFace.load() 对每个 @font-face 逐个触发加载；load() 失败会 reject，
   * 此时只能按现状继续（与修复前一致），不能让整条渲染链路挂死——
   * Android 侧的互斥锁还等着这个返回值。
   */
  var fontsPromise = null;
  function fontsReady() {
    if (!fontsPromise) {
      fontsPromise = Promise.all(
        Array.prototype.map.call(document.fonts, function (f) { return f.load(); })
      ).then(function () {
        return document.fonts.ready;
      }).catch(function () {
        return null;
      });
    }
    return fontsPromise;
  }

  /**
   * 页面加载阶段的字体就绪流程：渲染探测公式（把全部 KaTeX 字体族
   * 拉进加载状态）→ 等字体 → 通知 Android。
   *
   * 探测公式必须覆盖 KaTeX 用到的每个字体族，漏一个就仍有窄度量风险。
   * 渲染完立即清掉 #out，不影响后续 render()（它自己也会清）。
   */
  function initFonts() {
    var probe = '\\alpha\\beta\\gamma\\delta\\epsilon\\zeta\\eta\\theta' +
      '\\Gamma\\Delta\\Theta\\Lambda\\Xi\\Pi\\Sigma\\Phi\\Psi\\Omega' +
      '\\sum\\int\\prod\\sqrt{}\\frac{}{}\\mathbb{R}\\mathcal{F}' +
      '\\mathfrak{g}\\mathscr{A}\\mathtt{x}\\mathsf{y}\\mathrm{d}' +
      '\\left(\\right[0123456789+-=<>';
    try {
      katex.render(probe, document.getElementById('out'), {
        displayMode: false, throwOnError: false, strict: false, output: 'html'
      });
    } catch (e) { /* 探测失败不阻塞：fontsReady 仍会尝试直接加载 */ }
    document.getElementById('out').innerHTML = '';
    fontsReady().then(function () {
      if (window.AndroidMath && window.AndroidMath.onFontsReady) {
        window.AndroidMath.onFontsReady();
      }
    });
  }

  /**
   * 输出 **MathML**（不是位图）。
   *
   * 用于 HTML 导出：浏览器自带 MathML 渲染能力（Chrome 109+ / Safari / Firefox 均支持），
   * 所以导出的 HTML 可以不引任何 JS、不联网、且公式是**可选中可搜索**的真文字。
   * 这比内嵌位图好得多，也比引 KaTeX JS 好得多（那要 300KB+）。
   *
   * KaTeX 的 `output: 'mathml'` 与 HTML 输出的区别：HTML 输出会生成一大堆 span 体标记，
   * 原文几乎完全丢失；MathML 输出保留语义标记，所以选它。
   */
  function toMathML(latex, displayMode) {
    try {
      var ml = katex.renderToString(latex, {
        displayMode: !!displayMode,
        throwOnError: false,
        strict: false,
        output: 'mathml'
      });
      return JSON.stringify({ ml: ml });
    } catch (e) {
      // 返回空字符串而不是抛异常：Android 侧会回退到渲染位图，
      // 而位图路径永远可用。抛异常会让整份文档导出失败。
      return JSON.stringify({ ml: '' });
    }
  }

  /**
   * 单条渲染。**同步返回 JSON 字符串**（与 Android evaluateJavascript 语义匹配）。
   *
   * 字体就绪在页面加载阶段已完成（initFonts → AndroidMath 桥 → Kotlin pageLoaded 门），
   * 这里量到的必然是 KaTeX 字体度量。历史教训见 [fontsReady] 注释：
   * 这个函数曾经是 async 的，导致 v0.0.31~32 全量渲染失败，**不要再改回 async**。
   */
  function render(latex, displayMode, maxDevicePx) {
    var out = document.getElementById('out');
    // 单条路径只抠 #out，所以必须先把 #sheet 藏起来：
    // 两者都是 position:absolute 贴在 (0,0)，不藏会盖在 #out 上，
    // 抠出来的是上一次批量渲染的残留而不是本次公式。
    // （原来是在 renderBatch 结尾设 display:none，但那等于让批量路径抠到空白，
    //   正确做法是在**每条路径的入口**各管各的。）
    var sheet = document.getElementById('sheet');
    sheet.style.display = 'none';
    // getBoundingClientRect() 是 CSS 像素，而 Android 的 view.draw 画的是设备像素，
    // 高分屏上差一个 devicePixelRatio。必须乘 dpr 再返回，否则抠出来的是公式的一小块。
    var dpr = window.devicePixelRatio || 1;
    // 同时受两个上限约束：WebView 视口宽度、以及 Android 侧位图边长上限。
    // 必须在**渲染阶段**把字号缩到位；等抓到图再裁会把公式右边切掉一半。
    var limit = Math.min((window.innerWidth || 700), (maxDevicePx || 2048) / dpr);
    var maxW = Math.max(120, limit - 8);

    out.style.fontSize = BASE_PX + 'px';
    out.innerHTML = '';
    try {
      katex.render(latex, out, {
        displayMode: displayMode,
        throwOnError: false,
        strict: false,
        output: 'html'
      });
    } catch (e) {
      out.textContent = latex;
    }

    // 字体在页面加载阶段已就绪（见 [fontsReady]/initFonts），直接量即可。
    var rect = out.getBoundingClientRect();
    // 超宽公式整体缩字号，保证完整落在上限内
    if (rect.width > maxW) {
      out.style.fontSize = Math.max(8, Math.floor(BASE_PX * maxW / rect.width)) + 'px';
      rect = out.getBoundingClientRect();
    }
    /* v0.0.58: font already at the 8px floor and still too wide -> scale it.
       Without this the bitmap exceeds the 2048px cap and Kotlin clips the
       right side off (user: formulas cut on the right). getBoundingClientRect
       accounts for transforms, so the reported w/h stay truthful. */
    if (rect.width > maxW && rect.width > 0) {
      out.style.transformOrigin = 'left top';
      out.style.transform = 'scale(' + (maxW / rect.width) + ')';
      rect = out.getBoundingClientRect();
    }

    // fs 是本张位图实际用的字号（设备像素）。Android 侧按「目标字号 / fs」等比缩放，
    // 这样公式之间的相对大小才会一致；只按包围盒高度缩放会把单个字母撑得巨大。
    // err: 1 = 已被 JSON 转义破坏 / 2 = KaTeX 解析失败（红色错误）。
    // Android 侧据此回退成显示源码，而不是给用户看红色的乱码。
    var err = looksCorrupted(latex) ? 1 : (hasRenderError(out) ? 2 : 0);
    // v0.0.76：宽度用 ceil 而不是 round——CSS→设备像素换算后 round 可能
    // 少 0.5px，光栅化时最右一列墨水被切（用户反馈「右边仍被裁」的常见来源）。
    return JSON.stringify({
      w: Math.ceil(rect.width * dpr),
      h: Math.ceil(rect.height * dpr),
      fs: Math.round(parseFloat(out.style.fontSize) * dpr),
      err: err
    });
  }

  /**
   * 批量渲染：把多个公式**纵向排进同一条长卷**，一次光栅化后由 Android 侧按偏移切图。
   *
   * 单条路径每渲染一个公式要等 2 帧、draw 两次、开一张全尺寸位图。
   * 10 个公式就是 20 次 Choreographer 帧等待 + 10 次全量 draw —— 这就是「打开详情页很卡」的来源。
   * 批量把帧等待从 O(N) 降到 O(1)，是唯一量级上的改进。
   *
   * 每个公式包在自己的容器里，容器是 inline-block 且不换行，
   * 因此行盒高度由每个公式自己的高度决定，互不干扰。
   *
   * **同步返回**：字体在页面加载阶段已就绪（initFonts → AndroidMath 桥）。
   * 历史教训：这个函数曾经是 async 的，evaluateJavascript 不等 Promise，
   * 导致 v0.0.31~32 批量路径（PDF 导出）全废，**不要再改回 async**。
   */
  function renderBatch(items, maxDevicePx) {
    var dpr = window.devicePixelRatio || 1;
    var limit = Math.min((window.innerWidth || 700), (maxDevicePx || 2048) / dpr);
    var maxW = Math.max(120, limit - 8);

    var sheet = document.getElementById('sheet');
    sheet.innerHTML = '';
    sheet.style.display = 'block';

    // 排 + 量。偏移和尺寸都从 holder 自己的 rect 取，不受相邻行影响。
    var holders = [];
    for (var i = 0; i < items.length; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var holder = document.createElement('div');
      holder.className = 'body';
      cell.appendChild(holder);
      sheet.appendChild(cell);
      holders.push(holder);

      var fontSize = BASE_PX;
      try {
        katex.render(items[i].t, holder, {
          displayMode: !!items[i].d,
          throwOnError: false,
          strict: false,
          output: 'html'
        });
      } catch (e) {
        holder.textContent = items[i].t;
      }

      // 超宽公式在**渲染阶段**缩字号，保证完整落在上限内。
      // 事后裁剪会把公式右边切掉一半。
      // 注意 rect.width 含 .body 的 padding-right（见 CSS 注释），
      // 所以这里的上界比较已经把右安全距算进去了，不会撑爆长卷。
      var rect0 = holder.getBoundingClientRect();
      if (rect0.width > maxW) {
        fontSize = Math.max(8, Math.floor(BASE_PX * maxW / rect0.width));
        holder.style.fontSize = fontSize + 'px';
      }
      /* v0.0.58: same fallback as render() - scale instead of letting the
         bitmap overflow past the capture cap (which silently cuts the right). */
      var rect0b = holder.getBoundingClientRect();
      if (rect0b.width > maxW && rect0b.width > 0) {
        holder.style.transformOrigin = 'left top';
        holder.style.transform = 'scale(' + (maxW / rect0b.width) + ')';
      }
      // 暂存 fontSize，等字体就绪后连同最终 rect 一起输出
      holders[i].__fontSize = fontSize;
    }

    // 字体已在页面加载阶段就绪（initFonts），这里直接量最终 rect。
    var out = [];
    for (var j = 0; j < holders.length; j++) {
      var holder = holders[j];
      var rect = holder.getBoundingClientRect();
      out.push({
        k: items[j].k,
        x: Math.round(rect.left * dpr),
        y: Math.round(rect.top * dpr),
        w: Math.round(rect.width * dpr),
        h: Math.round(rect.height * dpr),
        fs: Math.round(holder.__fontSize * dpr),
        // 与单条路径同一套判定；PDF 导出走的是批量路径，
        // 漏了这里就会把红色错误原样印到纸上
        err: looksCorrupted(items[j].t) ? 1 : (hasRenderError(holder) ? 2 : 0)
      });
    }

    // Android 侧会按这个高度重新撑大视口再抠图，
    // 所以这里返回的是**内容**高度，不是当前视口高度。
    var h = 0;
    for (var m = 0; m < out.length; m++) {
      var bottom = out[m].y + out[m].h;
      if (bottom > h) h = bottom;
    }
    // 多留一点行间距余量：最后一个公式的下伸部（分母、根号钩）会略微溢出 rect
    var result = JSON.stringify({
      w: Math.max(1, Math.ceil(limit * dpr)),
      h: Math.max(1, Math.ceil(h) + Math.round(14 * dpr)),
      items: out
    });
    // **不要在这里把 #sheet 设成 display:none。**
    // Android 侧拿到返回值之后立刻 relayoutForBatch() + view.draw() 抠这张长卷，
    // 而 display:none 的元素不生成盒子、什么都不画 —— 抠出来必然是空白，
    // 再按各公式的偏移去切就全是空图（症状：公式不显示，回退成 LaTeX 源码）。
    // 藏 #sheet 的职责交给单条 render()，它在入口处把 #sheet 藏起来，
    // 避免它盖在 #out 上影响单条抠图。两条路径互斥，各自管各自的。
    return result;
  }

  // 页面加载即启动字体就绪流程；完成后经 AndroidMath 桥放行 Kotlin 的 pageLoaded 门。
  // 放在这里而不是 DOMContentLoaded 里：katex.min.js 是本 script 之前同步加载的，
  // 执行到这里 katex 一定已就绪。
  initFonts();
</script>
</body>
</html>
