# 不要强制 daemon 用 UTF-8：Gradle 把测试工作进程的 classpath 写进 @argfile，
# 写入用的是 daemon 的默认字符集，而 JDK 17 的 java 启动器**按系统默认字符集
# （中文 Windows 为 GBK）读** @argfile。两者不一致时，classpath 里的中文路径
# （本仓库是 E:\错题本）变成乱码，单元测试会全部报 ClassNotFoundException。
# 让 daemon 跟随系统默认字符集即可对齐（Linux/CI 的默认字符集本就是 UTF-8）。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 本机工作目录为中文路径（E:\错题本），AGP 的路径检查会拒绝中文路径；
# 这是 Google 官方提供的开关（CI 侧为 ASCII 路径，该开关无副作用）。
android.overridePathCheck=true
