# 单测在中文路径下全部 ClassNotFound 的根治（v0.0.153，JDK 21 时代）：
# Gradle 把测试工作进程的 classpath 写进 @argfile，写入用 **daemon 的默认字符集**；
# 而 Windows 上 `java` 启动器读 @argfile 用的是**系统 ANSI 代码页（中文 = GBK）**。
# JDK 21 因 JEP 400 默认字符集是 UTF-8，daemon 写 UTF-8、启动器读 GBK——
# classpath 里的中文路径（本仓库是 错题本）变成乱码，所有测试类报
# ClassNotFoundException。把 daemon 显式钉回 GBK 与启动器对齐即可。
# CI（Linux / 纯 ASCII 路径）：GBK 与 UTF-8 对 ASCII 字节完全一致，不受影响。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 本机工作目录为中文路径（E:\错题本），AGP 的路径检查会拒绝中文路径；
# 这是 Google 官方提供的开关（CI 侧为 ASCII 路径，该开关无副作用）。
android.overridePathCheck=true
